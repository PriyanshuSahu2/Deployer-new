root = "."
tmp_dir = "tmp"

[build]
cmd = "swag init && go build -o ./tmp/main ."
run = "APP_ENV=development ./tmp/main"
delay = 1000
exclude_dir = ["tmp","docs"]
include_ext = ["go", "tpl", "tmpl", "html", "css", "js"]

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"
app = "white"
