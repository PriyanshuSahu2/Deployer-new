services:
  nginx:
    image: nginx:alpine
    container_name: deployer-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - deployer-network

  backend:
    image: ghcr.io/priyanshusahu2/deployer-api:latest
    container_name: deployer-backend
    restart: always
    command: ./api-main
    env_file: .env
    environment:
      - DB_DSN=host=db user=postgres password=postgres dbname=deployer port=5432 sslmode=disable
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - deployer-network

  worker:
    image: ghcr.io/priyanshusahu2/deployer-worker:latest
    container_name: deployer-worker
    restart: always
    command: ./worker-main
    env_file: .env
    environment:
      - DB_DSN=host=db user=postgres password=postgres dbname=deployer port=5432 sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - deployer-network

  db:
    image: postgres:15-alpine
    container_name: deployer-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=deployer
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d deployer" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - deployer-network

  redis:
    image: redis:7-alpine
    container_name: deployer-redis
    restart: always
    networks:
      - deployer-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: deployer-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deployer-network

networks:
  deployer-network:
    driver: bridge

volumes:
  postgres_data:
