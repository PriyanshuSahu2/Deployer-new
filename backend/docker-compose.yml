version: '3.8'

services:
  backend:
    build: .
    container_name: deployer-backend
    command: ./api-main
    ports:
      - "8080:8080"
    environment:
      - DB_DSN=host=db user=postgres password=postgres dbname=deployer port=5432 sslmode=disable
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - deployer-network

  worker:
    build: .
    container_name: deployer-worker
    command: ./worker-main
    environment:
      - DB_DSN=host=db user=postgres password=postgres dbname=deployer port=5432 sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - deployer-network

  db:
    image: postgres:15-alpine
    container_name: deployer-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=deployer
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d deployer" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - deployer-network

  redis:
    image: redis:7-alpine
    container_name: deployer-redis
    ports:
      - "6379:6379"
    networks:
      - deployer-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: deployer-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - deployer-network

networks:
  deployer-network:
    driver: bridge

volumes:
  postgres_data:
