name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Dependencies
        run: go mod tidy

      - name: Build
        run: go build -v ./...

      - name: Run Tests
        run: go test ./... || echo "No tests defined or failed"

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-and-test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # WARNING: Update the path below to where your project sits on your Ubuntu server!
            cd /path/to/your/project/Deployer-new
            
            # Pull the latest code
            git pull origin main
            
            # Deploy Backend (using your docker-compose.yml)
            cd backend
            docker compose down
            docker compose up -d --build
